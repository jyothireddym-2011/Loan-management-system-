<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remove Lending Record — Lending Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/components.css">
</head>
<body>

  <div class="wrap">

    <header class="head">
      <p class="eyebrow">Lending Desk</p>
      <h1>Remove Lending Record</h1>
      <p class="sub">Confirm the borrower's identity and security password to permanently remove a settled record.</p>
    </header>

    <form id="removeForm" class="card" novalidate>

      <div class="field">
        <label for="bname">Borrower name</label>
        <input type="text" id="bname" placeholder="e.g. Ramesh Kumar" aria-describedby="err-bname" required>
        <span class="error" id="err-bname" role="alert" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="aadhar">Aadhar number</label>
        <input type="text" id="aadhar" inputmode="numeric" maxlength="14" placeholder="XXXX XXXX XXXX" autocomplete="off" aria-describedby="err-aadhar" required>
        <span class="error" id="err-aadhar" role="alert" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Security password</label>
        <div class="password-input">
          <input type="password" id="password" minlength="6" placeholder="Minimum 6 characters" autocomplete="current-password" aria-describedby="err-password" required>
          <button type="button" class="password-toggle" data-target="password" aria-pressed="false">
            <span class="visually-hidden">Show password</span>
            <span aria-hidden="true">Show</span>
          </button>
        </div>
        <span class="error" id="err-password" role="alert" aria-live="polite"></span>
      </div>
      <div class="field">
        <label for="confirmPassword">Confirm password</label>
        <div class="password-input">
          <input type="password" id="confirmPassword" minlength="6" placeholder="Re-enter password" autocomplete="current-password" aria-describedby="err-confirmPassword" required>
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-pressed="false">
            <span class="visually-hidden">Show password</span>
            <span aria-hidden="true">Show</span>
          </button>
        </div>
        <span class="error" id="err-confirmPassword" role="alert" aria-live="polite"></span>
      </div>

      <div class="actions">
        <button type="submit" class="submit-btn danger" id="submitBtn">Remove Record</button>
      </div>
    </form>

    <section id="resultCard" class="card summary hidden" aria-live="polite">
      <h2 id="resultHeading" tabindex="-1">Record removed</h2>
      <p id="resultMessage"></p>
    </section>

    <a class="back-link" href="../loan-registry/index.html">&larr; Back to services</a>
  </div>

  <!-- No static #toast div needed: shared/js/toast.js creates and manages
       its own #toast-region container automatically. -->

  <script src="../../config.js" defer></script>
  <script src="../../services/apiClient.js" defer></script>
  <script src="../../services/lendingService.js" defer></script>
  <script src="../../utils/validators.js" defer></script>
  <script src="../../components/toast.js" defer></script>
  <script src="../../components/confirmDialog.js" defer></script>
  <script src="remove.js" defer></script>
</body>
</html>
